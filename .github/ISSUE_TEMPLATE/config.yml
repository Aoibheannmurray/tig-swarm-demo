# Route non-bugs away from the tracker before they're typed, not after.
blank_issues_enabled: true
contact_links:
  - name: Feature ideas & building on this project
    url: https://github.com/tig-foundation/prometheus-early-beta/blob/main/CONTRIBUTING.md#what-to-expect-from-maintenance
    about: >
      Features and large changes are best carried in a fork — the code is
      GPLv3 precisely so you don't need to wait for us. Read this first.
  - name: Security vulnerabilities (private)
    url: https://github.com/tig-foundation/prometheus-early-beta/security/advisories/new
    about: Never open a public issue for a security problem — report it here.
