# Production image pipeline for the TIG-docker benchmark backend.
#
# One path for ALL challenges (CPU and GPU), keyed off the pinned version in
# tig_pin.json:
#
#   build-baked (Option B): builds the *custom* image (Dockerfile.bench = dev image
#     + re-added monorepo source + warm cargo cache + baked modified_test_algorithm)
#     and pushes it as `docker.io/<user>/tig-bench-<challenge>`. C3 pulls it (cached
#     per pool), injects ONLY the algorithm into the pre-baked swarm_algo slot, and
#     incremental-builds in seconds — no per-job source upload, no cold compile.
#     (See scripts/c3_compute.py `_TIG_BAKED_CHALLENGES`.)
#
#     GPU challenges bake too: nvcc pre-builds their PTX at image-build time (no GPU
#     needed to compile), and neuralnet_optimizer's seed-blinding anti-cheat is
#     applied to tig-challenges inside Dockerfile.bench before the warm build. The
#     old raw-mirror path (`tig-dev-*` + per-job source upload, Option A) is retired.
#
# Setup (one-time, by a repo/Docker Hub admin):
#   - Docker Hub access token (Read/Write).
#   - Repo secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN.
#   The Docker Hub namespace must match what the swarm pulls
#   (cfg["tig_dockerhub"] / env TIG_DOCKERHUB, default the username).
#
# NOTE: the baked build re-adds monorepo *source* that must match the pinned dev
# image. tig_pin.json tracks only the version tag; this workflow checks out
# tig-foundation/tig-monorepo at TIG_MONOREPO_REF (default: its default branch).
# Pin that ref to the release matching tig_version for digest-level repro.
#
# Run: on a manual dispatch, or automatically when the version pin changes.

name: Build & publish TIG images to Docker Hub

on:
  workflow_dispatch:
    inputs:
      monorepo_ref:
        description: "tig-monorepo git ref to build the baked source from"
        required: false
        default: ""
  push:
    paths:
      - "tig_pin.json"
      - "Dockerfile.bench"
      - "scripts/build_bench_image.sh"
      - "scripts/modified_test_algorithm"
      - "scripts/bench_blind_nn.py"
      - ".github/workflows/mirror-tig-images.yml"

permissions:
  contents: read

jobs:
  # -------- Build + push the baked custom image (Option B), all challenges ------
  # GPU challenges bake too (nvcc compiles PTX without a GPU). neuralnet's seed
  # blinding is baked in by Dockerfile.bench. The C3 path pulls these tig-bench-*
  # images for every challenge — there is no longer a raw dev-image path.
  #
  # Two native builds per challenge (amd64 on ubuntu-latest, arm64 on GitHub's
  # free arm runners — no QEMU), each pushed as :<ver>-<arch>; the merge job
  # below combines them into a multi-arch index on the main :<ver> tag. C3
  # pulls amd64 from that index; arm contributors (Apple Silicon, arm servers)
  # benchmarking locally pull arm64 via benchmark.py's pull-first path.
  build-baked:
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        challenge:
          - satisfiability
          - vehicle_routing
          - knapsack
          - job_scheduling
          - energy_arbitrage
          - vector_search
          - hypergraph
          - neuralnet_optimizer
    steps:
      - name: Checkout swarm repo
        uses: actions/checkout@v4

      - name: Free up runner disk (dev images are multi-GB)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          df -h /

      - name: Read pinned TIG version
        id: pin
        run: |
          ver=$(python3 -c "import json; print(json.load(open('tig_pin.json'))['tig_version'])")
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Pinned TIG version: $ver"

      - name: Checkout pinned TIG monorepo source
        uses: actions/checkout@v4
        with:
          repository: tig-foundation/tig-monorepo
          ref: ${{ github.event.inputs.monorepo_ref || '' }}
          path: _tig-monorepo

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build baked image for ${{ matrix.challenge }} (${{ matrix.arch }})
        env:
          VER: ${{ steps.pin.outputs.version }}
          PLATFORM: linux/${{ matrix.arch }}
        run: |
          bash scripts/build_bench_image.sh "${{ matrix.challenge }}" "$VER" \
            "${GITHUB_WORKSPACE}/_tig-monorepo"

      - name: Tag + push as tig-bench-${{ matrix.challenge }}:${{ steps.pin.outputs.version }}-${{ matrix.arch }}
        env:
          VER: ${{ steps.pin.outputs.version }}
          NS: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          LOCAL="tig-custom-image-${{ matrix.challenge }}:${VER}"
          DST="docker.io/${NS}/tig-bench-${{ matrix.challenge }}:${VER}-${{ matrix.arch }}"
          docker tag "$LOCAL" "$DST"
          docker push "$DST"
          echo "Pushed: $DST"

  # -------- Merge per-arch manifests into one multi-arch tag ------
  merge-manifests:
    needs: build-baked
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        challenge:
          - satisfiability
          - vehicle_routing
          - knapsack
          - job_scheduling
          - energy_arbitrage
          - vector_search
          - hypergraph
          - neuralnet_optimizer
    steps:
      - name: Checkout swarm repo
        uses: actions/checkout@v4

      - name: Read pinned TIG version
        id: pin
        run: |
          ver=$(python3 -c "import json; print(json.load(open('tig_pin.json'))['tig_version'])")
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-arch index for ${{ matrix.challenge }}
        env:
          VER: ${{ steps.pin.outputs.version }}
          NS: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          BASE="docker.io/${NS}/tig-bench-${{ matrix.challenge }}"
          docker buildx imagetools create -t "${BASE}:${VER}" \
            "${BASE}:${VER}-amd64" "${BASE}:${VER}-arm64"
          docker buildx imagetools inspect "${BASE}:${VER}"
