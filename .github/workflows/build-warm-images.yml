# Build & publish the WARM benchmark images (Dockerfile.warm): the swarm
# crate's own source + a pre-built release cargo target, one image per flavor
# (cpu / gpu). A C3 job pulls the image, injects only the algorithm dir, and
# incremental-builds in seconds — no per-job source upload, no cold compile.
# (See scripts/c3_compute.py `_warm_c3_image` / `_write_warm_c3_project`.)
#
# amd64 only: C3 nodes are linux/amd64 and local compute never uses these
# images (it builds natively from Dockerfile.cpu/gpu + a cargo volume), so
# there is deliberately no multi-arch matrix to babysit.
#
# Setup (one-time, by a repo/Docker Hub admin):
#   - Docker Hub access token (Read/Write).
#   - Repo secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN.
#   The Docker Hub namespace must match what the swarm pulls
#   (cfg["tig_dockerhub"] / env TIG_DOCKERHUB).
#
# Run: manual dispatch, or automatically when the crate the bake wraps changes.

name: Build & publish warm benchmark images

on:
  workflow_dispatch: {}
  push:
    branches: [staging, main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "requirements.txt"
      - "Dockerfile.warm"
      - ".github/workflows/build-warm-images.yml"

permissions:
  contents: read

jobs:
  build-warm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: cpu
            base: ubuntu:24.04
          - flavor: gpu
            base: nvidia/cuda:12.6.3-cudnn-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v4

      # The CUDA devel base + a warm cargo target need room; the stock runner
      # image ships ~20GB of toolchains we don't use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # src/*/algorithm is gitignored; the bake compiles the crate, so every
      # challenge needs SOME algorithm in its slot. Stubs are placeholders —
      # jobs always overwrite the algorithm dir.
      - name: Seed algorithms
        run: python3 scripts/seed_algorithms.py

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: |
          docker build -f Dockerfile.warm \
            --build-arg "FLAVOR=${{ matrix.flavor }}" \
            --build-arg "BASE=${{ matrix.base }}" \
            -t "tig-swarm-warm-${{ matrix.flavor }}" .

      - name: Push (latest + sha)
        env:
          NS: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          SHA="$(git rev-parse --short HEAD)"
          for tag in latest "$SHA"; do
            docker tag "tig-swarm-warm-${{ matrix.flavor }}" \
              "docker.io/$NS/tig-swarm-warm-${{ matrix.flavor }}:$tag"
            docker push "docker.io/$NS/tig-swarm-warm-${{ matrix.flavor }}:$tag"
          done
